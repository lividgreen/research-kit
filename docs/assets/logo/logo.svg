<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="160" height="160" role="img" aria-labelledby="t">
  <title id="t">research-kit logo</title>
  <defs>
    <linearGradient id="apex-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafcff"/>
      <stop offset="1" stop-color="#dbe2eb"/>
    </linearGradient>
    <filter id="shadow-base" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="shadow-apex" x="-25%" y="-20%" width="150%" height="145%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Badge: navy rim, slate fill, mint pinstripe -->
  <rect x="23.5" y="23.5" width="977" height="977" rx="170" fill="#0a1a30"/>
  <rect x="53" y="53" width="919" height="919" rx="150" fill="#182536"/>
  <rect x="57.5" y="57.5" width="910" height="910" rx="145.5" fill="none" stroke="#a3ebe4" stroke-width="8.5"/>

  <!-- Left card: amber, magnifying glass -->
  <g filter="url(#shadow-base)">
    <rect x="102.5" y="392" width="380" height="505.5" rx="42" fill="#e9a02a"/>
    <rect x="132.5" y="422.5" width="320" height="445" rx="28" fill="none" stroke="#824c00" stroke-width="11.5"/>
    <g fill="none" stroke="#7b4a04">
      <circle cx="268.5" cy="621.5" r="74.5" stroke-width="25"/>
      <line x1="316" y1="669" x2="346" y2="699" stroke-width="18" stroke-linecap="butt"/>
    </g>
    <rect x="331" y="701" width="74" height="35" rx="10" fill="#7b4a04" transform="rotate(45 368 718.5)"/>
  </g>

  <!-- Right card: mint, open book -->
  <g filter="url(#shadow-base)">
    <rect x="541.5" y="392" width="380" height="505.5" rx="42" fill="#88ebb8"/>
    <rect x="571.5" y="422.5" width="320" height="445" rx="28" fill="none" stroke="#034a2a" stroke-width="11.5"/>
    <!-- cover -->
    <g fill="#0f5032">
      <rect x="612.7" y="572.7" width="238" height="152.3" rx="9"/>
      <path d="M698 724 C708 724 708 738 718 738 L745 738 C755 738 755 724 765 724 Z"/>
    </g>
    <!-- mint outline around the pages, then the pages -->
    <g fill="#88ebb8" stroke="#88ebb8" stroke-width="19" stroke-linejoin="round">
      <path id="page-r-halo" d="M736.7 570.7 C760 556 775 552 790 552.3 C805 552.5 815 554 825 556.7 L825 696.7 C800 697 760 699 736.7 711 Z"/>
      <use href="#page-r-halo" transform="translate(1462.6 0) scale(-1 1)"/>
    </g>
    <g fill="#0f5032">
      <path id="page-r" d="M736.7 570.7 C760 556 775 552 790 552.3 C805 552.5 815 554 825 556.7 L825 696.7 C800 697 760 699 736.7 711 Z"/>
      <use href="#page-r" transform="translate(1462.6 0) scale(-1 1)"/>
    </g>
  </g>

  <!-- Apex card: silver, "AI" -->
  <g filter="url(#shadow-apex)">
    <rect x="324.5" y="126.5" width="375" height="501" rx="42" fill="url(#apex-fill)"/>
    <rect x="354.5" y="157" width="315" height="440" rx="28" fill="none" stroke="#353c4e" stroke-width="10.5"/>
    <g fill="#07152b">
      <path fill-rule="evenodd" d="M464.5 295 H503 L565.5 457 H529.5 L516.5 420.5 H450.5 L438 457 H402 Z M483.75 332 L462 392.5 H505.75 Z"/>
      <rect x="583.75" y="295" width="33.5" height="162"/>
    </g>
  </g>
</svg>
