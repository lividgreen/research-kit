<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 536" width="720" height="536" role="img" aria-labelledby="pipeline-title pipeline-desc">
  <title id="pipeline-title">research-kit's pipeline</title>
  <desc id="pipeline-desc">The six kinds of card in two rows, and what each can produce. The cards drawn into a hand are on top: an idea, a question and a task, each of which can produce more of its own kind. An idea can also produce every other kind; a question produces tasks and findings; a task produces findings. Below are the cards laid on the table: a goal, a direction and a finding, none of which produces another card. Every card may also come straight from the conversation with the person.</desc>
  <style>
    text { font-family: Geist, ui-sans-serif, system-ui, sans-serif; }
    .name { font-size: 18px; font-weight: 600; fill: #191c1d; }
    .what, .label { font-size: 14px; fill: #464555; }
    .box { stroke: #c7c4d8; stroke-width: 2; }
    .tint { fill: #eef0fe; }
    .plain { fill: #f3f4f5; }
    .icon { fill: none; stroke: #464555; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .arrow { stroke-width: 2; fill: none; }
    .line { stroke: #464555; }
    .accent { stroke: #3525cd; }
    .head-line { fill: #464555; }
    .head-accent { fill: #3525cd; }
    @media (prefers-color-scheme: dark) {
      .name { fill: #e8eaef; }
      .what, .label { fill: #b8bcc8; }
      .box { stroke: #434957; }
      .tint { fill: #211f45; }
      .plain { fill: #1c2027; }
      .icon, .line { stroke: #b8bcc8; }
      .accent { stroke: #a9a2ff; }
      .head-line { fill: #b8bcc8; }
      .head-accent { fill: #a9a2ff; }
    }
  </style>
  <defs>
    <marker id="head-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head-line" d="M0 0 10 5 0 10z"/></marker>
    <marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head-accent" d="M0 0 10 5 0 10z"/></marker>
  </defs>
  <path class="arrow accent" marker-end="url(#head-accent)" d="M4 138H38"/>
  <path class="arrow accent" marker-end="url(#head-accent)" d="M400 2V98"/>
  <path class="arrow accent" marker-end="url(#head-accent)" d="M650 2V98"/>
  <path class="arrow accent" marker-end="url(#head-accent)" d="M130 458V408"/>
  <path class="arrow accent" marker-end="url(#head-accent)" d="M360 458V408"/>
  <path class="arrow accent" marker-end="url(#head-accent)" d="M590 458V408"/>
  <path class="arrow line" marker-end="url(#head-line)" d="M60 100V84Q60 72 72 72H98Q110 72 110 84V98"/>
  <path class="arrow line" marker-end="url(#head-line)" d="M290 100V84Q290 72 302 72H328Q340 72 340 84V98"/>
  <path class="arrow line" marker-end="url(#head-line)" d="M520 100V84Q520 72 532 72H558Q570 72 570 84V98"/>
