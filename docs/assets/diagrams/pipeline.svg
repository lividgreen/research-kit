  <rect class="box tint" x="40" y="100" width="180" height="76" rx="8"/>
  <g class="icon" transform="translate(56 122) scale(1.33)"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></g>
  <text class="name" x="100" y="133">Idea</text>
  <text class="what" x="100" y="157">a thought</text>
  <rect class="box tint" x="270" y="100" width="180" height="76" rx="8"/>
  <g class="icon" transform="translate(286 122) scale(1.33)"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.7M12 16.8v.4"/></g>
  <text class="name" x="330" y="133">Question</text>
  <text class="what" x="330" y="157">to answer</text>
  <rect class="box tint" x="500" y="100" width="180" height="76" rx="8"/>
  <g class="icon" transform="translate(516 122) scale(1.33)"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></g>
  <text class="name" x="560" y="133">Task</text>
  <text class="what" x="560" y="157">to do</text>
  <rect class="box plain" x="40" y="330" width="180" height="76" rx="8"/>
  <g class="icon" transform="translate(56 352) scale(1.33)"><path d="M6 21V4M6 5h11l-2 4 2 4H6"/></g>
  <text class="name" x="100" y="363">Goal</text>
  <text class="what" x="100" y="387">to reach</text>
  <rect class="box plain" x="270" y="330" width="180" height="76" rx="8"/>
  <g class="icon" transform="translate(286 352) scale(1.33)"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></g>
  <text class="name" x="330" y="363">Direction</text>
  <text class="what" x="330" y="387">to follow</text>
  <rect class="box plain" x="500" y="330" width="180" height="76" rx="8"/>
  <g class="icon" transform="translate(516 352) scale(1.33)"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></g>
  <text class="name" x="560" y="363">Finding</text>
  <text class="what" x="560" y="387">a checked claim</text>
  <rect class="box tint" x="40" y="484" width="28" height="18" rx="4"/>
  <text class="label" x="78" y="498">a card drawn into a hand</text>
  <rect class="box plain" x="290" y="484" width="28" height="18" rx="4"/>
  <text class="label" x="328" y="498">a card laid on the table</text>
  <path class="arrow accent" marker-end="url(#head-accent)" d="M40 520H68"/>
  <text class="label" x="78" y="525">minted from the conversation with the person</text>
</svg>
