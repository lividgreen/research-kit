  <path class="arrow line" marker-end="url(#head-line)" d="M195 100V32Q195 20 207 20H692Q704 20 704 32V356Q704 368 692 368H682"/>
  <path class="arrow line" marker-end="url(#head-line)" d="M100 176V328"/>
  <path class="arrow line" marker-end="url(#head-line)" d="M190 176V218Q190 230 202 230H328Q340 230 340 242V328"/>
  <path class="arrow line" marker-end="url(#head-line)" d="M420 176V241Q420 253 432 253H548Q560 253 560 265V328"/>
