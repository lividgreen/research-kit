# Remote hooks a project pins by `rev`: pre-commit installs this repository as a Python package
# (pyproject.toml) and runs the console scripts, so the project keeps no copy of the scripts.
#
#   - repo: https://github.com/lividgreen/research-kit
#     rev: <tag>
#     hooks:
#       - id: flow-check
#       - id: library-check
#       - id: formal-check
#       - id: formal-cite        # each of these three with its bindings in formal.toml
#       - id: formal-anchors
#       - id: formal-register
#
# Each check reads its bindings file at the project root; a project with no flow.toml or no
# library.toml leaves that hook out, and one that binds no anchor key or register class leaves those out.
- id: flow-check
  name: flow check (records, their references and evidence, index freshness)
  entry: flow check
  language: python
  pass_filenames: false
  always_run: true
- id: library-check
  name: library check (cards, kept copies, extracts, reference entries, index freshness)
  entry: library check
  language: python
  pass_filenames: false
  always_run: true
- id: formal-check
  name: formal check (the manifests parse and are the tree's, the prover bindings resolve)
  entry: formal check
  language: python
  pass_filenames: false
  always_run: true
- id: formal-cite
  name: formal cite (every declaration name the documents cite resolves)
  entry: formal cite
  language: python
  pass_filenames: false
  always_run: true
- id: formal-anchors
  name: formal anchors (every [Key] §N of the Lean files resolves in its document)
  entry: formal anchors
  language: python
  pass_filenames: false
  always_run: true
- id: formal-register
  name: formal register (what ships carries none of the bound pattern classes)
  entry: formal register
  language: python
  pass_filenames: false
  always_run: true
